<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>나이스 학사일정 수집기</title>
<style>
:root{
  --bg:#F4F6F7; --panel:#fff; --ink:#1A1D21; --ink2:#5A646E; --ink3:#8B949E;
  --line:#DDE2E6; --blue:#25587F;
  --ok:#1E7A4C; --ok-bg:#E6F3EC; --bad:#A32D2D; --bad-bg:#FAEDEC; --warn:#8A5A0B; --warn-bg:#FBF2E0;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"D2Coding",monospace;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);
  font:14px/1.6 -apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-variant-numeric:tabular-nums}
.wrap{max-width:900px;margin:0 auto;padding:24px 20px 80px}
h1{font-size:20px;font-weight:600;margin:0 0 4px}
.sub{color:var(--ink2);font-size:13px;margin:0 0 20px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:16px;margin-bottom:14px}
.panel h2{font-size:13px;font-weight:600;margin:0 0 12px;color:var(--ink2);letter-spacing:.04em;text-transform:uppercase}
label{display:block;font-size:12px;color:var(--ink2);margin:0 0 5px;font-weight:500}
input{width:100%;font:13px/1.5 var(--mono);color:var(--ink);background:#fff;
  border:1px solid var(--line);border-radius:5px;padding:8px 10px}
input:focus{outline:2px solid var(--blue);outline-offset:-1px;border-color:transparent}
.grid{display:grid;grid-template-columns:1fr 110px 110px 130px;gap:12px}
button{font:13px/1 inherit;font-weight:600;background:var(--blue);color:#fff;border:none;
  border-radius:5px;padding:11px 18px;cursor:pointer}
button:disabled{background:#A9B4BD;cursor:not-allowed}
button.sec{background:#fff;color:var(--ink2);border:1px solid var(--line);font-weight:500}
.warnbox{background:var(--warn-bg);border:1px solid #EBDCB4;border-radius:6px;padding:11px 13px;
  font-size:12.5px;color:var(--warn);margin-bottom:14px;line-height:1.6}
.bar{height:6px;background:#E4E9EC;border-radius:3px;overflow:hidden;margin:12px 0 8px}
.bar i{display:block;height:100%;background:var(--blue);width:0;transition:width .15s}
.status{font:12px/1.6 var(--mono);color:var(--ink2)}
table{width:100%;border-collapse:collapse;font-size:12.5px}
th,td{text-align:left;padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;color:var(--ink3);font-weight:600;text-transform:uppercase;letter-spacing:.04em;
  position:sticky;top:0;background:var(--panel)}
td.n{font-family:var(--mono)}
.scroll{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:6px}
.badge{display:inline-block;font-size:10.5px;font-weight:600;padding:2px 7px;border-radius:4px}
.b-ok{background:var(--ok-bg);color:var(--ok)} .b-partial{background:var(--warn-bg);color:var(--warn)}
.b-none{background:var(--bad-bg);color:var(--bad)}
.meters{display:flex;flex-wrap:wrap;gap:24px;margin:14px 0 6px}
.meters p{margin:0}
.meters .k{font-size:11px;color:var(--ink3)}
.meters .v{font-size:18px;font-weight:600;font-family:var(--mono)}
.kinds{display:flex;gap:16px;margin-top:12px}
.kinds label{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--ink);margin:0;font-weight:400;cursor:pointer}
.kinds input{width:auto}
select{width:100%;font:14px/1.5 inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:5px;padding:9px 10px}
.verdict{padding:13px 15px;border-radius:7px;margin-bottom:10px;font-size:13.5px;line-height:1.65}
.v-ok{background:var(--ok-bg);color:var(--ok)} .v-bad{background:var(--bad-bg);color:var(--bad)}
.v-warn{background:var(--warn-bg);color:var(--warn)}
.verdict b{font-weight:600}
.stats{display:flex;gap:26px;margin-bottom:14px}
.stats .k{font-size:11px;color:var(--ink3);margin:0}
.stats .v{font-size:20px;font-weight:600;font-family:var(--mono);margin:0}
pre{background:#1F2429;color:#D9E2EA;font:12px/1.6 var(--mono);padding:13px;border-radius:6px;
  overflow-x:auto;margin:8px 0 0;white-space:pre-wrap}
.muted{color:var(--ink3);font-size:12px}
</style>
</head>
<body>
<div class="wrap">
  <h1>학사일정 수집기</h1>
  <p class="sub">학부모 앱이 읽는 <code>data/</code> 폴더를 만듭니다.</p>

  <div class="warnbox">
    인증키가 들어 있는 파일입니다. 웹사이트에 올리거나 공유하지 마세요.
    막히면 이 파일이 있는 폴더에서 <code>python3 -m http.server</code> 실행 후 <code>localhost:8000</code>으로 여세요.
  </div>

  <div class="panel">
    <h2>설정</h2>
    <div class="grid">
      <div><label for="key">인증키</label><input id="key" value=""></div>
      <div><label for="office">교육청</label><select id="office"></select></div>
      <div><label for="sy">학년도</label><input id="sy" value="2026" inputmode="numeric"></div>
      <div><label>&nbsp;</label><span class="muted">교육청을 하나씩 돌리면 결과가 쌓입니다</span></div>
    </div>
    <div class="kinds">
      <label><input type="checkbox" class="kind" value="초등학교" checked> 초등학교</label>
      <label><input type="checkbox" class="kind" value="중학교" checked> 중학교</label>
      <label><input type="checkbox" class="kind" value="고등학교" checked> 고등학교</label>
    </div>
    <div style="display:flex;gap:8px;margin-top:16px">
      <button id="go">수집 시작</button>
      <button class="sec" id="stop" disabled>중단</button>
      <button class="sec" id="reset">전부 지우기</button>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="meters">
      <p><span class="k">경과</span><br><span class="v" id="mTime">0초</span></p>
      <p><span class="k">호출</span><br><span class="v" id="mCalls">0</span></p>
      <p><span class="k">초당</span><br><span class="v" id="mRate">-</span></p>
      <p><span class="k">실패</span><br><span class="v" id="mFail">0</span></p>
      <p><span class="k">남은 시간</span><br><span class="v" id="mEta">-</span></p>
    </div>
    <p class="log" id="status">대기 중</p>
  </div>

  <div class="panel" id="verdictPanel" style="display:none">
    <h2>호출 제한 판정</h2>
    <div id="verdict"></div>
  </div>

  <div class="panel" id="resPanel" style="display:none">
    <h2>수집한 교육청</h2>
    <div class="scroll"><table id="tbl"><thead><tr>
      <th>교육청</th><th>학교</th><th>ok</th><th>partial</th><th>none</th><th>소요</th>
    </tr></thead><tbody></tbody></table></div>
    <div style="display:flex;gap:8px;margin-top:14px;flex-wrap:wrap">
      <button id="dl">파일 내려받기</button>
      <button class="sec" id="dlReport">리포트 내려받기</button>
    </div>
    <pre id="layout"></pre>
  </div>

  <div class="panel" id="repPanel" style="display:none">
    <h2>리포트</h2>
    <pre id="report"></pre>
  </div>
</div>

<script>
"use strict";
var BASE = "https://open.neis.go.kr/hub/";
var OFFICES = [
  ["B10","서울특별시교육청"],["C10","부산광역시교육청"],["D10","대구광역시교육청"],
  ["E10","인천광역시교육청"],["F10","광주광역시교육청"],["G10","대전광역시교육청"],
  ["H10","울산광역시교육청"],["I10","세종특별자치시교육청"],["J10","경기도교육청"],
  ["K10","강원특별자치도교육청"],["M10","충청북도교육청"],["N10","충청남도교육청"],
  ["P10","전북특별자치도교육청"],["Q10","전라남도교육청"],["R10","경상북도교육청"],
  ["S10","경상남도교육청"],["T10","제주특별자치도교육청"]
];
var store = {}, stopFlag = false, calls = 0, fails = 0, failLog = [], t0 = 0, reportText = "";

function $(id){ return document.getElementById(id); }
function pad(n){ return String(n).padStart(2,"0"); }
function iso(d){ return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate()); }
function D(s){ return new Date(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10)); }
function add(d,n){ return new Date(d.getFullYear(), d.getMonth(), d.getDate()+n); }
function esc(s){ return String(s==null?"":s).replace(/[&<>"]/g,function(c){
  return {"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;"}[c]; }); }
function sleep(ms){ return new Promise(function(r){ setTimeout(r, ms); }); }
function hms(sec){
  sec = Math.round(sec);
  if (sec < 60) return sec + "초";
  var m = Math.floor(sec/60);
  return m < 60 ? m + "분 " + (sec%60) + "초" : Math.floor(m/60) + "시간 " + (m%60) + "분";
}

/* ---------- 공휴일 규칙 (학부모 앱과 동일) ---------- */
var FIXED = [["01-01","신정",0],["03-01","삼일절",1],["05-01","노동절",1],["05-05","어린이날",1],
             ["06-06","현충일",0],["07-17","제헌절",1],["08-15","광복절",1],["10-03","개천절",1],
             ["10-09","한글날",1],["12-25","성탄절",1]];
var LUNAR = {2025:["2025-01-29","2025-10-06","2025-05-05"],2026:["2026-02-17","2026-09-25","2026-05-24"],
             2027:["2027-02-07","2027-09-15","2027-05-13"],2028:["2028-01-27","2028-10-03","2028-05-02"],
             2029:["2029-02-13","2029-09-22","2029-05-20"],2030:["2030-02-03","2030-09-12","2030-05-09"],
             2031:["2031-01-23","2031-10-01","2031-05-28"]};
var EXTRA = {"2026-06-03":"선거일"};
var holCache = {};

function holidays(y){
  if (holCache[y]) return holCache[y];
  var m = {}, subs = [];
  function put(k,n){ if (!m[k]) m[k] = n; }
  FIXED.forEach(function(f){
    var k = y + "-" + f[0]; put(k, f[1]);
    if (f[2]) subs.push({end:k, kind:"wk", name:f[1]});
  });
  var L = LUNAR[y];
  if (L){
    [[L[0],"설날"],[L[1],"추석"]].forEach(function(p){
      var mid = D(p[0]);
      [-1,0,1].forEach(function(o){ put(iso(add(mid,o)), p[1]); });
      subs.push({mid:iso(mid), end:iso(add(mid,1)), kind:"fest", name:p[1]});
    });
    put(L[2],"부처님오신날");
    subs.push({end:L[2], kind:"wk", name:"부처님오신날"});
  }
  for (var e in EXTRA) if (e.slice(0,4) == y) put(e, EXTRA[e]);
  subs.forEach(function(sb){
    var need = 0;
    function clash(d){ var k = iso(d); return m[k] && m[k] !== sb.name; }
    if (sb.kind === "fest"){
      var mid = D(sb.mid);
      [-1,0,1].forEach(function(o){ var d = add(mid,o); if (d.getDay()===0 || clash(d)) need++; });
    } else {
      var e2 = D(sb.end); if (e2.getDay()===0 || e2.getDay()===6 || clash(e2)) need++;
    }
    var d2 = add(D(sb.end),1), g = 0;
    while (need > 0 && g++ < 20){
      var k2 = iso(d2), w = d2.getDay();
      if (w!==0 && w!==6 && !m[k2]){ m[k2] = "대체공휴일"; need--; }
      d2 = add(d2,1);
    }
  });
  holCache[y] = m; return m;
}

/* ---------- 수업일수 (190일 언저리가 아니면 데이터 이상) ---------- */
function schoolDays(sy, vac, clo){
  var hol = Object.assign({}, holidays(sy), holidays(sy+1));
  var cloSet = {}; clo.forEach(function(k){ cloSet[k] = 1; });
  var d = new Date(sy,2,1), end = new Date(sy+1,1,28), n = 0;
  while (d.getTime() <= end.getTime()){
    var k = iso(d), w = d.getDay();
    var inVac = vac.some(function(v){ return k >= v[0] && k <= v[1]; });
    if (w!==0 && w!==6 && !hol[k] && !cloSet[k] && !inVac) n++;
    d = add(d,1);
  }
  return n;
}

/* ---------- 정규화 ---------- */
function groupRuns(dates){
  var s = dates.slice().sort(function(a,b){ return a-b; }), runs = [];
  s.forEach(function(d){
    if (runs.length){
      var last = runs[runs.length-1], ok = true, p = add(last[last.length-1],1);
      while (p.getTime() < d.getTime()){
        var w = p.getDay(); if (w!==0 && w!==6){ ok = false; break; } p = add(p,1);
      }
      if (ok){ last.push(d); return; }
    }
    runs.push([d]);
  });
  return runs;
}
function normalize(rows){
  var vocab = {}, nulls = 0, off = {}, pub = {};
  rows.forEach(function(r){
    var nm = (r.SBTR_DD_SC_NM || "").trim();
    var vk = nm || "(null)"; vocab[vk] = (vocab[vk]||0)+1; if (!nm) nulls++;
    var y = r.AA_YMD || ""; if (y.length !== 8) return;
    var d = new Date(+y.slice(0,4), +y.slice(4,6)-1, +y.slice(6,8));
    if (nm.indexOf("공휴일") >= 0){ pub[iso(d)] = 1; return; }
    var byName = !nm && /방학|휴업|재량/.test(r.EVENT_NM || "");
    if (nm.indexOf("휴업") < 0 && !byName) return;
    if (d.getDay()===0 || d.getDay()===6) return;
    off[iso(d)] = 1;
  });
  var dates = Object.keys(off).map(D);
  var vac = [], clo = [];
  groupRuns(dates).forEach(function(run){
    if (run.length >= 5) vac.push([iso(run[0]), iso(run[run.length-1])]);
    else run.forEach(function(d){ clo.push(iso(d)); });
  });
  /* 학교가 공휴일을 휴업일로 중복 등록한 경우 제거 (선거일 등) */
  clo = clo.filter(function(k){ return !holidays(+k.slice(0,4))[k]; });
  return {vac:vac, clo:clo.sort(), pub:pub,
          nullRatio: rows.length ? nulls/rows.length : 1};
}
function grade(n, vac, clo){
  if (!vac.length && !clo.length) return "none";
  if (!vac.length || n < 185 || n > 200) return "partial";
  return "ok";
}


/* ---------- API ---------- */
function url(service, params){
  var q = ["Type=json","pIndex=" + (params.pIndex||1),"pSize=1000"];
  var k = $("key").value.trim(); if (k) q.push("KEY=" + encodeURIComponent(k));
  for (var p in params) if (p!=="pIndex" && params[p] != null && params[p] !== "")
    q.push(p + "=" + encodeURIComponent(params[p]));
  return BASE + service + "?" + q.join("&");
}
async function call(service, params){
  var rows = [], total = null, page = 1;
  while (page <= 30){
    params.pIndex = page;
    var body = null;
    for (var t=0;t<3;t++){
      try{
        calls++;
        var res = await fetch(url(service, params));
        if (!res.ok) throw new Error("HTTP " + res.status);
        body = await res.json();
        break;
      }catch(e){
        if (t === 2){
          fails++;
          if (failLog.length < 30) failLog.push((params.SD_SCHUL_CODE || params.ATPT_OFCDC_SC_CODE || "") + "  " + e.message);
          return {rows:rows, total:total, code:"NET"};
        }
        await sleep(800 * (t+1));
      }
    }
    if (!body[service]) return {rows:rows, total:total, code:(body.RESULT||{}).CODE || "?"};
    var head = body[service][0].head;
    if (total === null) total = head[0].list_total_count;
    rows = rows.concat(body[service][1].row || []);
    if (rows.length >= total) break;
    page++;
  }
  return {rows:rows, total:total, code:"INFO-000"};
}

/* ---------- 실행 ---------- */
function tick(done, all){
  var el = (Date.now() - t0) / 1000;
  $("mTime").textContent = hms(el);
  $("mCalls").textContent = calls;
  $("mRate").textContent = el > 1 ? (calls/el).toFixed(1) : "-";
  $("mFail").textContent = fails;
  $("mFail").style.color = fails ? "var(--bad)" : "";
  if (done && all){
    $("mEta").textContent = hms((all-done) * (el/done));
    $("prog").style.width = Math.round(done/all*100) + "%";
  }
}

async function run(){
  stopFlag = false; calls = 0; fails = 0; failLog = []; t0 = Date.now();
  $("go").disabled = true; $("stop").disabled = false;
  $("verdictPanel").style.display = "none";

  var office = $("office").value, sy = parseInt($("sy").value, 10);
  var kinds = Array.prototype.filter.call(document.querySelectorAll(".kind"), function(c){ return c.checked; })
                   .map(function(c){ return c.value; });
  if (!kinds.length){ alert("학교급을 하나 이상 골라주세요."); $("go").disabled=false; $("stop").disabled=true; return; }
  var frm = sy + "0301", to = (sy+1) + "0228";

  $("status").textContent = "학교 목록을 가져오는 중…";
  var schools = [], officeName = office;
  for (var ki=0; ki<kinds.length; ki++){
    var r = await call("schoolInfo", {ATPT_OFCDC_SC_CODE:office, SCHUL_KND_SC_NM:kinds[ki]});
    if (r.code === "NET"){
      $("status").textContent = "학교 목록 호출 실패 — CORS나 네트워크를 확인하세요.";
      $("go").disabled = false; $("stop").disabled = true; return;
    }
    (r.rows||[]).forEach(function(x){
      officeName = x.ATPT_OFCDC_SC_NM || officeName;
      schools.push([x.SD_SCHUL_CODE, x.SCHUL_NM, kinds[ki].charAt(0)]);
    });
    tick(0,0);
  }
  if (!schools.length){
    $("status").textContent = office + " 에서 학교를 찾지 못했습니다.";
    $("go").disabled = false; $("stop").disabled = true; return;
  }

  var idx = [], cal = {}, counts = {ok:0, partial:0, none:0}, warns = [], pubSeen = {};
  var started = Date.now();
  for (var i=0;i<schools.length;i++){
    if (stopFlag) break;
    var sd = schools[i][0], name = schools[i][1], k1 = schools[i][2], id = office + "_" + sd;
    $("status").textContent = "[" + (i+1) + "/" + schools.length + "] " + name;
    tick(i+1, schools.length);
    var q = "none", days = 0, norm = {vac:[], clo:[], pub:{}};
    var sch = await call("SchoolSchedule", {ATPT_OFCDC_SC_CODE:office, SD_SCHUL_CODE:sd,
                                            AA_FROM_YMD:frm, AA_TO_YMD:to});
    if (sch.code === "INFO-000" && sch.rows.length){
      norm = normalize(sch.rows);
      days = schoolDays(sy, norm.vac, norm.clo);
      q = grade(days, norm.vac, norm.clo);
      for (var p in norm.pub) pubSeen[p] = (pubSeen[p]||0)+1;
    }
    counts[q]++;
    idx.push([id, name, k1]);
    if (q !== "none") cal[id] = {v:norm.vac, c:norm.clo, q:q, d:days};
    if (q !== "ok") warns.push(office + " " + name + " (" + id + "): " + q + ", 수업일 " + days + "일, 방학 " + norm.vac.length + "개");
    await sleep(60);
  }
  idx.sort(function(a,b){ return a[1].localeCompare(b[1], "ko"); });
  store[office] = {code:office, name:officeName, sy:sy, idx:idx, cal:cal, counts:counts,
                   warns:warns, pub:pubSeen, secs:(Date.now()-started)/1000, stopped:stopFlag};

  tick(schools.length, schools.length);
  $("status").textContent = stopFlag ? "중단됨" : "완료";
  $("go").disabled = false; $("stop").disabled = true;
  renderResults(); renderVerdict(schools.length);
}

function renderVerdict(n){
  var el = (Date.now() - t0) / 1000, perSchool = calls / Math.max(1, n), h = "";
  if (fails === 0){
    h += '<div class="verdict v-ok"><b>호출 제한에 걸리지 않았습니다.</b> ' + n + "개교를 " + hms(el) +
         " 만에 실패 없이 받았습니다. 초당 " + (calls/Math.max(1,el)).toFixed(1) + "회입니다.</div>";
    h += '<div class="verdict v-ok">같은 속도라면 전국 약 1만 2천 개교는 <b>' +
         hms(12000 * perSchool / (calls/Math.max(1,el))) + "</b> 정도 걸립니다.</div>";
  } else if (fails < Math.max(3, n*0.02)){
    h += '<div class="verdict v-warn"><b>실패 ' + fails + "회.</b> 일시적 오류로 보이며 재시도로 넘어갔습니다.</div>";
  } else {
    h += '<div class="verdict v-bad"><b>실패 ' + fails + "회 — 호출 제한이 의심됩니다.</b> " +
         "교육청을 나눠 돌리거나 시간을 두고 다시 시도하세요.</div>";
  }
  if (failLog.length) h += "<pre>" + esc(failLog.join("\n")) + "</pre>";
  $("verdict").innerHTML = h;
  $("verdictPanel").style.display = "";
}

function renderResults(){
  var tb = $("tbl").tBodies[0]; tb.innerHTML = "";
  var offices = [], total = 0, all = {ok:0,partial:0,none:0}, warns = [], pub = {};
  OFFICES.forEach(function(o){
    var s = store[o[0]]; if (!s) return;
    var n = s.idx.length; total += n;
    ["ok","partial","none"].forEach(function(k){ all[k] += s.counts[k]; });
    warns = warns.concat(s.warns);
    for (var p in s.pub) pub[p] = (pub[p]||0) + s.pub[p];
    offices.push({code:s.code, name:s.name, count:n, ok:s.counts.ok,
                  partial:s.counts.partial, none:s.counts.none});
    var tr = document.createElement("tr");
    tr.innerHTML = "<td>" + esc(s.name) + (s.stopped ? " (중단)" : "") + "</td>" +
      '<td class="n">' + n + '</td><td class="n">' + s.counts.ok + '</td><td class="n">' +
      s.counts.partial + '</td><td class="n">' + s.counts.none + '</td><td class="n">' + hms(s.secs) + "</td>";
    tb.appendChild(tr);
  });
  $("resPanel").style.display = offices.length ? "" : "none";
  if (!offices.length) return;

  var sy = store[offices[0].code].sy;
  var rule = Object.assign({}, holidays(sy), holidays(sy+1));
  var suspects = Object.keys(pub).filter(function(k){
    return !rule[k] && pub[k] >= Math.max(20, Math.floor(total/20));
  }).sort();

  var L = ["수집 결과 — " + sy + "학년도",
           "생성 " + iso(new Date()) + " / 교육청 " + offices.length + "곳 / 학교 " + total + "개교",
           "", "전체 품질 분포"];
  ["ok","partial","none"].forEach(function(k){
    L.push("  " + k + "  " + all[k] + "개교  " + Math.round(all[k]*100/Math.max(1,total)) + "%");
  });
  L.push("", "교육청별");
  offices.forEach(function(o){
    L.push("  " + o.code + " " + o.name + "  " + o.count + "개교   ok " +
           Math.round(o.ok*100/Math.max(1,o.count)) + "%");
  });
  if (suspects.length){
    L.push("", "공휴일 규칙에 없는데 여러 학교가 표시한 날 (임시공휴일 의심)");
    suspects.forEach(function(k){ L.push("  " + k + "  " + pub[k] + "개교"); });
  }
  if (warns.length){
    L.push("", "확인이 필요한 학교 (" + warns.length + "곳)");
    warns.slice(0,200).forEach(function(w){ L.push("  " + w); });
    if (warns.length > 200) L.push("  … 외 " + (warns.length-200) + "곳");
  }
  reportText = L.join("\n");
  $("report").textContent = reportText;
  $("repPanel").style.display = "";
  $("layout").textContent = "내려받은 파일을 앱 옆에 이렇게 두세요\n\n  교외체험학습_신청도우미.html\n  data/\n   ├─ index.json\n" +
    offices.map(function(o){ return "   ├─ idx/" + o.code + ".json"; }).join("\n") + "\n" +
    offices.map(function(o){ return "   ├─ cal/" + o.code + ".json"; }).join("\n");
  window._offices = offices;
}

function download(name, text){
  var b = new Blob([text], {type:"application/json;charset=utf-8"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(b); a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function(){ a.remove(); URL.revokeObjectURL(a.href); }, 800);
}
$("dl").onclick = async function(){
  var offices = window._offices || []; if (!offices.length) return;
  var sy = store[offices[0].code].sy;
  download("index.json", JSON.stringify({sy:sy, fetched:iso(new Date()), offices:offices}, null, 1));
  for (var i=0;i<offices.length;i++){
    var s = store[offices[i].code];
    await sleep(700); download(s.code + "-idx.json", JSON.stringify(s.idx));
    await sleep(700); download(s.code + "-cal.json", JSON.stringify(s.cal));
  }
  alert("내려받은 파일 이름을 바꿔 주세요.\n\nindex.json      → data/index.json\nB10-idx.json → data/idx/B10.json\nB10-cal.json → data/cal/B10.json");
};
$("dlReport").onclick = function(){
  var b = new Blob([reportText], {type:"text/plain;charset=utf-8"});
  var a = document.createElement("a"); a.href = URL.createObjectURL(b); a.download = "report.txt";
  document.body.appendChild(a); a.click(); setTimeout(function(){ a.remove(); }, 500);
};
$("go").onclick = function(){ run().catch(function(e){
  $("status").textContent = "오류: " + e.message;
  $("go").disabled = false; $("stop").disabled = true; }); };
$("stop").onclick = function(){ stopFlag = true; };
$("reset").onclick = function(){
  store = {}; ["resPanel","repPanel","verdictPanel"].forEach(function(x){ $(x).style.display = "none"; });
  $("status").textContent = "대기 중"; $("prog").style.width = "0";
};
$("office").innerHTML = OFFICES.map(function(o){
  return '<option value="' + o[0] + '">' + o[1] + "</option>";
}).join("");
$("office").value = "B10";
</script>
</body>
